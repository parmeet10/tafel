[project]
name = "tafel"
version = "0.1.0"
description = "MCP server that renders explainer animations onto a chalkboard-style viewer page"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "manim>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]
